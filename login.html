<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - Gestión de Mantenimiento</title>

    <link rel="icon" type="image/png" href="img/bantel.png">

    <style>

        /* ========================================
           CONFIGURACIÓN GENERAL
        ======================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: #f8fafc;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* ========================================
           CONTENEDOR
        ======================================== */

        .login-container {

            width: 100%;
            max-width: 420px;

            padding: 20px;
        }


        /* ========================================
           CAJA LOGIN
        ======================================== */

        .login-box {

            background: #1e293b;

            border: 1px solid #334155;

            border-radius: 14px;

            padding: 35px;

            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.45);
        }


        /* ========================================
           LOGO
        ======================================== */

        .logo {

            width: 80px;
            height: 80px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #111827;

            border-radius: 12px;

            border: 1px solid #374151;

            overflow: hidden;
        }

        .logo img {

            width: 100%;
            height: 100%;

            object-fit: contain;
        }


        /* ========================================
           TITULO
        ======================================== */

        h1 {

            text-align: center;

            font-size: 24px;

            margin-bottom: 8px;

            color: #f8fafc;
        }


        .subtitulo {

            text-align: center;

            color: #94a3b8;

            font-size: 14px;

            margin-bottom: 30px;
        }


        /* ========================================
           FORMULARIO
        ======================================== */

        .campo {

            margin-bottom: 20px;
        }


        .campo label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: bold;

            color: #cbd5e1;
        }


        .campo input {

            width: 100%;

            padding: 13px 14px;

            background: #0f172a;

            color: #f8fafc;

            border: 1px solid #475569;

            border-radius: 8px;

            outline: none;

            font-size: 15px;

            transition: 0.2s;
        }


        .campo input::placeholder {

            color: #64748b;
        }


        .campo input:focus {

            border-color: #64748b;

            box-shadow:
                0 0 0 3px rgba(100, 116, 139, 0.15);
        }


        /* ========================================
           BOTÓN
        ======================================== */

        .btn-login {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .btn-login:hover {

            background: #1d4ed8;

        }


        .btn-login:active {

            transform: scale(0.98);

        }


        /* ========================================
           MENSAJE DE ERROR
        ======================================== */

        .error {

            display: none;

            margin-top: 15px;

            padding: 11px;

            border-radius: 8px;

            background: #450a0a;

            border: 1px solid #7f1d1d;

            color: #fca5a5;

            font-size: 14px;

            text-align: center;
        }


        /* ========================================
           PIE
        ======================================== */

        .footer {

            margin-top: 25px;

            text-align: center;

            color: #64748b;

            font-size: 12px;
        }


        /* ========================================
           RESPONSIVE
        ======================================== */

        @media (max-width: 480px) {

            .login-container {

                padding: 15px;
            }

            .login-box {

                padding: 25px;
            }

        }

    </style>

</head>


<body>


    <div class="login-container">

        <div class="login-box">


            <!-- LOGO -->

            <div class="logo">

                <!--
                    Coloca aquí tu logo.
                    Ejemplo:
                    img/logo.png
                -->

                <img
                    src="/img/bantel.png"
                    alt="Logo de la empresa"
                    onerror="this.style.display='none'"
                >

            </div>


            <!-- TITULO -->

            <h1>
                Gestión de Mantenimiento
            </h1>


            <p class="subtitulo">
                Inicia sesión para continuar
            </p>


            <!-- FORMULARIO -->

            <form id="loginForm">


                <div class="campo">

                    <label for="usuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Ingrese su usuario"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingrese su contraseña"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-login"
                    id="btnLogin"
                >
                    Iniciar sesión
                </button>


                <div
                    class="error"
                    id="mensajeError"
                ></div>


            </form>


            <div class="footer">

                Sistema de Gestión de Mantenimiento

            </div>


        </div>

    </div>



    <script>

        // ========================================
        // LOGIN
        // ========================================

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function (event) {

                event.preventDefault();


                const usuario =
                    document
                        .getElementById("usuario")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const boton =
                    document
                        .getElementById("btnLogin");


                const mensaje =
                    document
                        .getElementById("mensajeError");


                mensaje.style.display = "none";


                boton.disabled = true;

                boton.textContent = "Ingresando...";


                try {

                    const respuesta =
                        await fetch("/api/login", {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body: JSON.stringify({

                                usuario: usuario,

                                password: password

                            })

                        });


                    const resultado =
                        await respuesta.json();


                    if (!respuesta.ok) {

                        mensaje.textContent =
                            resultado.error ||
                            "Usuario o contraseña incorrectos.";

                        mensaje.style.display =
                            "block";

                        return;

                    }


                    // ========================================
                    // LOGIN CORRECTO
                    // ========================================

                    window.location.href = "/";


                }
                catch (error) {

                    console.error(error);

                    mensaje.textContent =
                        "No se pudo conectar con el servidor.";

                    mensaje.style.display =
                        "block";

                }
                finally {

                    boton.disabled = false;

                    boton.textContent =
                        "Iniciar sesión";

                }

            });

    </script>


</body>

</html>
